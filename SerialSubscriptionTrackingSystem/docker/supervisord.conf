[supervisord]
nodaemon=true
user=root

; Serves the actual app. Same command the Dockerfile ran directly before.
[program:php-serve]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel's scheduler only does anything if `schedule:run` is invoked on a
; timer — normally a real OS cron entry firing every minute. Render's Web
; Service containers don't give us crontab access, so this loop is the
; substitute: it calls schedule:run every 60 seconds, exactly like cron
; would. Laravel itself decides whether any given command is actually due
; (dailyAt('08:00'), weeklyOn(...), etc.) — this loop just has to show up
; once a minute and ask.
[program:laravel-scheduler]
command=/bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0